version: "3"
services:

  gateway:
    image: nginx:1.25-bookworm
    volumes:
      - ./gateway_nginx_medium.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    deploy:
      resources:
        limits:
          cpus: '2'
    depends_on:
      - order-service
      - stock-service
      - payment-service

  order-service:
    build: ./order
    image: order:latest
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
    environment:
      - GATEWAY_URL=http://gateway:80
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CHECKOUT_COMMANDS_TOPIC=checkout.commands
      - KAFKA_REPLIES_TOPICS=checkout.replies
      - INTERNAL_TRANSPORT=kafka
      - KAFKA_REQUEST_TIMEOUT_SEC=15
      - KAFKA_ORDER_GROUP_ID=order-service
      - ORCHESTRATOR_URL=http://orchestrator:8000
    command: hypercorn -b 0.0.0.0:5000 --workers 2 app:app
    env_file:
      - env/order_redis.env
    depends_on:
      order-db-primary:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  orchestrator:
    build: ./orchestrator
    image: orchestrator:latest
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '3'
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CHECKOUT_COMMANDS_TOPIC=checkout.commands
      - KAFKA_CHECKOUT_REPLIES_TOPIC=checkout.replies
      - KAFKA_STOCK_COMMANDS_TOPIC=stock.commands
      - KAFKA_REPLIES_TOPICS=stock.replies,payment.replies
      - KAFKA_PAYMENT_COMMANDS_TOPIC=payment.commands
      - KAFKA_REQUEST_TIMEOUT_SEC=15
      - KAFKA_ORCHESTRATOR_GROUP_ID=orchestrator-group
    command: hypercorn -b 0.0.0.0:8000 --workers 2 app:app
    env_file:
      - env/order_redis.env
    depends_on:
      order-db-primary:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  # ── order DB cluster ────────────────────────────────────────────────────────
  order-db-primary:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
    command: >
      redis-server
      --requirepass redis
      --maxmemory 1gb
      --appendonly yes
      --appendfsync everysec
      --min-replicas-to-write 1
      --min-replicas-max-lag 5
    volumes:
      - order-db-primary-data:/data

  order-db-replica-1:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
    command: >
      redis-server
      --requirepass redis
      --maxmemory 1gb
      --appendonly yes
      --appendfsync always
      --replicaof order-db-primary 6379
      --masterauth redis
    volumes:
      - order-db-replica-1-data:/data
    depends_on:
      - order-db-primary

  order-db-replica-2:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
    command: >
      redis-server
      --requirepass redis
      --maxmemory 1gb
      --appendonly yes
      --appendfsync always
      --replicaof order-db-primary 6379
      --masterauth redis
    volumes:
      - order-db-replica-2-data:/data
    depends_on:
      - order-db-primary

  # ── stock DB cluster ─────────────────────────────────────────────────────────
  stock-db-primary:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
    command: >
      redis-server
      --requirepass redis
      --maxmemory 1gb
      --appendonly yes
      --appendfsync everysec
      --min-replicas-to-write 1
      --min-replicas-max-lag 5
    volumes:
      - stock-db-primary-data:/data

  stock-db-replica-1:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
    command: >
      redis-server
      --requirepass redis
      --maxmemory 1gb
      --appendonly yes
      --appendfsync always
      --replicaof stock-db-primary 6379
      --masterauth redis
    volumes:
      - stock-db-replica-1-data:/data
    depends_on:
      - stock-db-primary

  stock-db-replica-2:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
    command: >
      redis-server
      --requirepass redis
      --maxmemory 1gb
      --appendonly yes
      --appendfsync always
      --replicaof stock-db-primary 6379
      --masterauth redis
    volumes:
      - stock-db-replica-2-data:/data
    depends_on:
      - stock-db-primary

  # ── payment DB cluster ────────────────────────────────────────────────────────
  payment-db-primary:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
    command: >
      redis-server
      --requirepass redis
      --maxmemory 1gb
      --appendonly yes
      --appendfsync everysec
      --min-replicas-to-write 1
      --min-replicas-max-lag 5
    volumes:
      - payment-db-primary-data:/data

  payment-db-replica-1:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
    command: >
      redis-server
      --requirepass redis
      --maxmemory 1gb
      --appendonly yes
      --appendfsync always
      --replicaof payment-db-primary 6379
      --masterauth redis
    volumes:
      - payment-db-replica-1-data:/data
    depends_on:
      - payment-db-primary

  payment-db-replica-2:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
    command: >
      redis-server
      --requirepass redis
      --maxmemory 1gb
      --appendonly yes
      --appendfsync always
      --replicaof payment-db-primary 6379
      --masterauth redis
    volumes:
      - payment-db-replica-2-data:/data
    depends_on:
      - payment-db-primary

  # ── sentinels ─────────────────────────────────────────────────────────────────
  sentinel-1:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
    volumes:
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
      - ./redis/reconfig.sh:/scripts/reconfig.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      - order-db-primary
      - order-db-replica-1
      - order-db-replica-2
      - stock-db-primary
      - stock-db-replica-1
      - stock-db-replica-2
      - payment-db-primary
      - payment-db-replica-1
      - payment-db-replica-2

  sentinel-2:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
    volumes:
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
      - ./redis/reconfig.sh:/scripts/reconfig.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      - order-db-primary
      - order-db-replica-1
      - order-db-replica-2
      - stock-db-primary
      - stock-db-replica-1
      - stock-db-replica-2
      - payment-db-primary
      - payment-db-replica-1
      - payment-db-replica-2

  sentinel-3:
    image: redis:7.2-bookworm
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
    volumes:
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
      - ./redis/reconfig.sh:/scripts/reconfig.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      - order-db-primary
      - order-db-replica-1
      - order-db-replica-2
      - stock-db-primary
      - stock-db-replica-1
      - stock-db-replica-2
      - payment-db-primary
      - payment-db-replica-1
      - payment-db-replica-2

  stock-service:
    build: ./stock
    image: stock:latest
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '3'
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_STOCK_COMMANDS_TOPIC=stock.commands
      - KAFKA_STOCK_REPLIES_TOPIC=stock.replies
      - KAFKA_ORDER_EVENTS_TOPIC=order.events
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --log-level=info app:app
    env_file:
      - env/stock_redis.env
    depends_on:
      stock-db-primary:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  payment-service:
    build: ./payment
    image: user:latest
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '3'
    environment:
      - INTERNAL_TRANSPORT=kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_PAYMENT_COMMANDS_TOPIC=payment.commands
      - KAFKA_PAYMENT_REPLIES_TOPIC=payment.replies
      - KAFKA_PAYMENT_GROUP_ID=payment-service
      - KAFKA_ORDER_EVENTS_TOPIC=order.events
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --log-level=info app:app
    env_file:
      - env/payment_redis.env
    depends_on:
      payment-db-primary:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    deploy:
      resources:
        limits:
          cpus: '0.5'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    deploy:
      resources:
        limits:
          cpus: '5.5'
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    deploy:
      resources:
        limits:
          cpus: '0.5'
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka

  kafka-setup:
    image: confluentinc/cp-kafka:7.6.1
    deploy:
      resources:
        limits:
          cpus: '0.5'
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./create_topics_medium.sh:/create_topics.sh:ro
    entrypoint: [ "/bin/bash", "-c", "tr -d '\\r' < /create_topics.sh | bash" ]
    restart: "no"

  watchdog:
    image: docker:cli
    deploy:
      resources:
        limits:
          cpus: '0.5'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchdog.sh:/watchdog.sh:ro
    entrypoint: ["sh", "/watchdog.sh"]
    restart: always

volumes:
  order-db-primary-data:
  order-db-replica-1-data:
  order-db-replica-2-data:
  stock-db-primary-data:
  stock-db-replica-1-data:
  stock-db-replica-2-data:
  payment-db-primary-data:
  payment-db-replica-1-data:
  payment-db-replica-2-data: