version: "3"
services:

  gateway:
    image: nginx:1.25-bookworm
    volumes:
      - ./gateway_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - order-service
      - stock-service
      - payment-service

  order-service:
    build: ./order
    image: order:latest
    restart: always
    environment:
      - GATEWAY_URL=http://gateway:80
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CHECKOUT_COMMANDS_TOPIC=checkout.commands
      - KAFKA_REPLIES_TOPICS=checkout.replies
      - INTERNAL_TRANSPORT=kafka
      - KAFKA_REQUEST_TIMEOUT_SEC=15
      - KAFKA_ORDER_GROUP_ID=order-service
      - ORCHESTRATOR_URL=http://orchestrator:8000
    command: hypercorn -b 0.0.0.0:5000 --workers 4 app:app
    env_file:
      - env/order_redis.env
    depends_on:
      order-db-primary:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  orchestrator:
    build: ./orchestrator
    image: orchestrator:latest
    restart: always
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CHECKOUT_COMMANDS_TOPIC=checkout.commands
      - KAFKA_CHECKOUT_REPLIES_TOPIC=checkout.replies
      - KAFKA_STOCK_COMMANDS_TOPIC=stock.commands
      - KAFKA_REPLIES_TOPICS=stock.replies,payment.replies
      - KAFKA_PAYMENT_COMMANDS_TOPIC=payment.commands
      - KAFKA_REQUEST_TIMEOUT_SEC=15
      - KAFKA_ORCHESTRATOR_GROUP_ID=orchestrator-group
    command: hypercorn -b 0.0.0.0:8000 --workers 4 app:app
    env_file:
      - env/order_redis.env
    depends_on:
      order-db-primary:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  # ── order DB cluster ────────────────────────────────────────────────────────
  order-db-primary:
    image: redis:7.2-bookworm
    restart: always
    command: >
      redis-server
      --requirepass redis
      --maxmemory 512mb
      --appendonly yes
      --appendfsync everysec
      --min-replicas-to-write 1
      --min-replicas-max-lag 5
    volumes:
      - order-db-primary-data:/data

  order-db-replica-1:
    image: redis:7.2-bookworm
    restart: always
    command: >
      redis-server
      --requirepass redis
      --maxmemory 512mb
      --appendonly yes
      --appendfsync always
      --replicaof order-db-primary 6379
      --masterauth redis
    volumes:
      - order-db-replica-1-data:/data
    depends_on:
      - order-db-primary

  order-db-replica-2:
    image: redis:7.2-bookworm
    restart: always
    command: >
      redis-server
      --requirepass redis
      --maxmemory 512mb
      --appendonly yes
      --appendfsync always
      --replicaof order-db-primary 6379
      --masterauth redis
    volumes:
      - order-db-replica-2-data:/data
    depends_on:
      - order-db-primary

  # ── stock DB cluster ─────────────────────────────────────────────────────────
  stock-db-primary:
    image: redis:7.2-bookworm
    restart: always
    command: >
      redis-server
      --requirepass redis
      --maxmemory 512mb
      --appendonly yes
      --appendfsync everysec
      --min-replicas-to-write 1
      --min-replicas-max-lag 5
    volumes:
      - stock-db-primary-data:/data

  stock-db-replica-1:
    image: redis:7.2-bookworm
    restart: always
    command: >
      redis-server
      --requirepass redis
      --maxmemory 512mb
      --appendonly yes
      --appendfsync always
      --replicaof stock-db-primary 6379
      --masterauth redis
    volumes:
      - stock-db-replica-1-data:/data
    depends_on:
      - stock-db-primary

  stock-db-replica-2:
    image: redis:7.2-bookworm
    restart: always
    command: >
      redis-server
      --requirepass redis
      --maxmemory 512mb
      --appendonly yes
      --appendfsync always
      --replicaof stock-db-primary 6379
      --masterauth redis
    volumes:
      - stock-db-replica-2-data:/data
    depends_on:
      - stock-db-primary

  # ── payment DB cluster ────────────────────────────────────────────────────────
  payment-db-primary:
    image: redis:7.2-bookworm
    restart: always
    command: >
      redis-server
      --requirepass redis
      --maxmemory 512mb
      --appendonly yes
      --appendfsync everysec
      --min-replicas-to-write 1
      --min-replicas-max-lag 5
    volumes:
      - payment-db-primary-data:/data

  payment-db-replica-1:
    image: redis:7.2-bookworm
    restart: always
    command: >
      redis-server
      --requirepass redis
      --maxmemory 512mb
      --appendonly yes
      --appendfsync always
      --replicaof payment-db-primary 6379
      --masterauth redis
    volumes:
      - payment-db-replica-1-data:/data
    depends_on:
      - payment-db-primary

  payment-db-replica-2:
    image: redis:7.2-bookworm
    restart: always
    command: >
      redis-server
      --requirepass redis
      --maxmemory 512mb
      --appendonly yes
      --appendfsync always
      --replicaof payment-db-primary 6379
      --masterauth redis
    volumes:
      - payment-db-replica-2-data:/data
    depends_on:
      - payment-db-primary

  # ── sentinels ─────────────────────────────────────────────────────────────────
  sentinel-1:
    image: redis:7.2-bookworm
    restart: always
    volumes:
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
      - ./redis/reconfig.sh:/scripts/reconfig.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      - order-db-primary
      - order-db-replica-1
      - order-db-replica-2
      - stock-db-primary
      - stock-db-replica-1
      - stock-db-replica-2
      - payment-db-primary
      - payment-db-replica-1
      - payment-db-replica-2

  sentinel-2:
    image: redis:7.2-bookworm
    restart: always
    volumes:
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
      - ./redis/reconfig.sh:/scripts/reconfig.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      - order-db-primary
      - order-db-replica-1
      - order-db-replica-2
      - stock-db-primary
      - stock-db-replica-1
      - stock-db-replica-2
      - payment-db-primary
      - payment-db-replica-1
      - payment-db-replica-2

  sentinel-3:
    image: redis:7.2-bookworm
    restart: always
    volumes:
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
      - ./redis/reconfig.sh:/scripts/reconfig.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      - order-db-primary
      - order-db-replica-1
      - order-db-replica-2
      - stock-db-primary
      - stock-db-replica-1
      - stock-db-replica-2
      - payment-db-primary
      - payment-db-replica-1
      - payment-db-replica-2

  stock-service:
    build: ./stock
    image: stock:latest
    restart: always
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_STOCK_COMMANDS_TOPIC=stock.commands
      - KAFKA_STOCK_REPLIES_TOPIC=stock.replies
      - KAFKA_ORDER_EVENTS_TOPIC=order.events
    command: gunicorn -b 0.0.0.0:5000 -w 3 --timeout 30 --log-level=info app:app
    env_file:
      - env/stock_redis.env
    depends_on:
      stock-db-primary:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  payment-service:
    build: ./payment
    image: user:latest
    restart: always
    environment:
      - INTERNAL_TRANSPORT=kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_PAYMENT_COMMANDS_TOPIC=payment.commands
      - KAFKA_PAYMENT_REPLIES_TOPIC=payment.replies
      - KAFKA_PAYMENT_GROUP_ID=payment-service
      - KAFKA_ORDER_EVENTS_TOPIC=order.events
    command: gunicorn -b 0.0.0.0:5000 -w 3 --timeout 30 --log-level=info app:app
    env_file:
      - env/payment_redis.env
    depends_on:
      payment-db-primary:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-1}
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka

  kafka-setup:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./create_topics.sh:/create_topics.sh:ro
    entrypoint: [ "/bin/bash", "-c", "tr -d '\\r' < /create_topics.sh | bash" ]
    restart: "no"

  watchdog:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: |
      sh -c '
      while true; do
        for service in dds26-18-order-service-1 dds26-18-stock-service-1 dds26-18-payment-service-1 dds26-18-orchestrator-1; do
          STATUS=$$(docker inspect $$service --format="{{.State.Status}}" 2>/dev/null)
          if [ "$$STATUS" = "exited" ] || [ "$$STATUS" = "dead" ]; then
            echo "$$service is down, restarting..."
            docker start $$service
          fi
        done
        for db in dds26-18-order-db-primary-1 dds26-18-order-db-replica-1-1 dds26-18-order-db-replica-2-1 dds26-18-stock-db-primary-1 dds26-18-stock-db-replica-1-1 dds26-18-stock-db-replica-2-1 dds26-18-payment-db-primary-1 dds26-18-payment-db-replica-1-1 dds26-18-payment-db-replica-2-1; do
          STATUS=$$(docker inspect $$db --format="{{.State.Status}}" 2>/dev/null)
          if [ "$$STATUS" = "exited" ] || [ "$$STATUS" = "dead" ]; then
            echo "$$db is down, restarting..."
            docker start $$db
            sleep 3
            ROLE=$$(docker exec $$db redis-cli -a redis ROLE 2>/dev/null | head -1)
            if [ "$$ROLE" = "master" ]; then
              docker exec $$db redis-cli -a redis CONFIG SET appendfsync everysec 2>/dev/null || true
            else
              docker exec $$db redis-cli -a redis CONFIG SET appendfsync always 2>/dev/null || true
            fi
          fi
        done
        sleep 2
      done
      '
    restart: always

volumes:
  order-db-primary-data:
  order-db-replica-1-data:
  order-db-replica-2-data:
  stock-db-primary-data:
  stock-db-replica-1-data:
  stock-db-replica-2-data:
  payment-db-primary-data:
  payment-db-replica-1-data:
  payment-db-replica-2-data:
